name: Auto-unpack uploaded ZIP
on:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
  actions: write
# One unpack at a time: two uploads close together must not push over each other.
concurrency:
  group: auto-unpack
  cancel-in-progress: false
jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect and verify newly uploaded ZIP
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t uploads < <(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" | grep -E '^[^/]+\.zip$' || true)
          if (( ${#uploads[@]} != 1 )); then
            echo "Expected exactly one newly added root ZIP, found ${#uploads[@]}; no changes made."
            echo 'found=false' >> "$GITHUB_OUTPUT"
          else
            echo "zip=${uploads[0]}" >> "$GITHUB_OUTPUT"
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Unpack safely and check guard
        if: steps.detect.outputs.found == 'true'
        env:
          UPLOAD: ${{ steps.detect.outputs.zip }}
        run: bash tools/auto-unpack.sh "$UPLOAD"
      - name: Commit unpacked files
        if: steps.detect.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name axon-unpack
          git config user.email axon-unpack@users.noreply.github.com
          git add -A
          git commit -m "Auto-unpack verified project upload"
          # The branch may have moved while this run worked (a second upload, another bot commit).
          # Then the first push is rejected: fetch the newer commits, put ours on top, try again.
          git fetch --unshallow origin 2>/dev/null || true
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (branch moved); rebasing onto the newest commits, attempt ${attempt} of 3."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Could not push after 3 tries; nothing was lost, the uploaded ZIP is still in the repository."
          exit 1
      - name: Start Android build (bot commits do not trigger push workflows)
        if: steps.detect.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-debug.yml --ref "${GITHUB_REF_NAME}"
